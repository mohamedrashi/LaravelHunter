[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laravelhunter"
version = "0.9.1"
description = "Safe Laravel security assessment engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13,<15",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "packaging>=24,<26",
  "typer>=0.12,<1"
]

[project.scripts]
laravelhunter = "laravelhunter.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["laravelhunter*"]

[tool.setuptools.package-data]
laravelhunter = ["data/rules/*.yml", "data/advisories/*.yml"]
